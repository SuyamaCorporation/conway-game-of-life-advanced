<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway Game of Life with Rule Explorer</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen p-3">
<div class="max-w-4xl mx-auto">
  <h1 class="text-2xl font-bold text-green-400 mb-1">Conway's Game of Life — Rule Explorer</h1>

  <div class="flex flex-wrap gap-3 mb-3 items-end">
    <!-- Rules -->
    <div class="flex items-center gap-2">
      <label class="text-xs text-gray-400">Birth (B):</label>
      <input id="birthRule" type="text" value="3" maxlength="9" class="w-20 bg-gray-800 border border-gray-600 text-white rounded px-2 py-1 text-sm font-mono" aria-label="Birth rule digits" title="Digits 0-8 for birth rule">
    </div>
    <div class="flex items-center gap-2">
      <label class="text-xs text-gray-400">Survival (S):</label>
      <input id="surviveRule" type="text" value="23" maxlength="9" class="w-20 bg-gray-800 border border-gray-600 text-white rounded px-2 py-1 text-sm font-mono" aria-label="Survival rule digits">
    </div>
    <button onclick="applyRules()" class="bg-green-700 hover:bg-green-600 px-3 py-1 rounded text-sm font-bold">Apply</button>

    <!-- Presets -->
    <select id="presetSelect" onchange="loadPreset()" class="bg-gray-800 border border-gray-600 text-white rounded px-2 py-1 text-sm">
      <option value="">Presets...</option>
      <option value="glider">Glider</option>
      <option value="gun">Gosper Gun</option>
      <option value="pulsar">Pulsar</option>
      <option value="rpentomino">R-pentomino</option>
      <option value="acorn">Acorn</option>
    </select>

    <!-- Controls -->
    <button onclick="toggleRun()" id="runBtn" class="bg-green-600 hover:bg-green-500 px-3 py-1 rounded text-sm font-bold">▶ Run</button>
    <button onclick="stepOnce()" class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-sm">Step</button>
    <button onclick="clearGrid()" class="bg-red-900 hover:bg-red-800 px-3 py-1 rounded text-sm">Clear</button>
    <button onclick="randomize()" class="bg-blue-900 hover:bg-blue-800 px-3 py-1 rounded text-sm">Random</button>

    <div class="flex items-center gap-2">
      <label class="text-xs text-gray-400">Speed:</label>
      <input type="range" id="speed" min="1" max="30" value="10" class="w-20" aria-label="Speed">
      <span id="speedVal" class="text-xs text-gray-400 w-6">10</span>
    </div>

    <label class="flex items-center gap-1 text-xs cursor-pointer">
      <input type="checkbox" id="wrapToggle" checked> Wrap
    </label>
  </div>

  <!-- Stats bar -->
  <div class="flex gap-4 text-xs text-gray-400 mb-2">
    <span>Gen: <span id="genCount" class="text-green-300 font-bold">0</span></span>
    <span>Pop: <span id="popCount" class="text-green-300 font-bold">0</span></span>
    <span class="text-gray-600" id="ruleDisplay">B3/S23</span>
  </div>

  <div class="flex gap-3">
    <canvas id="lifeCanvas" class="border border-gray-800 rounded cursor-crosshair" style="touch-action:none;" aria-label="Game of Life grid"></canvas>
    <!-- Population sparkline -->
    <div class="flex flex-col">
      <div class="text-xs text-gray-500 mb-1">Pop.</div>
      <canvas id="sparkCanvas" width="60" height="200" class="border border-gray-800 rounded"></canvas>
    </div>
  </div>
</div>

<script>
const CELL = 9;
const COLS = 74, ROWS = 54;
const W = COLS * CELL, H = ROWS * CELL;

const canvas = document.getElementById('lifeCanvas');
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d');
const sparkCanvas = document.getElementById('sparkCanvas');
const sparkCtx = sparkCanvas.getContext('2d');

let grid = new Uint8Array(COLS * ROWS);
let nextGrid = new Uint8Array(COLS * ROWS);
let gen = 0, running = false, rafId;
let birthSet = new Set([3]);
let surviveSet = new Set([2,3]);
let popHistory = [];
let painting = false, paintValue = 1;

document.getElementById('speed').oninput = function() {
  document.getElementById('speedVal').textContent = this.value;
};

function idx(r, c) { return r * COLS + c; }

function applyRules() {
  const b = document.getElementById('birthRule').value;
  const s = document.getElementById('surviveRule').value;
  birthSet = new Set(b.split('').filter(c=>/[0-8]/.test(c)).map(Number));
  surviveSet = new Set(s.split('').filter(c=>/[0-8]/.test(c)).map(Number));
  document.getElementById('ruleDisplay').textContent = `B${[...birthSet].sort().join('')}/S${[...surviveSet].sort().join('')}`;
}

function getNeighbors(r, c) {
  const wrap = document.getElementById('wrapToggle').checked;
  let n = 0;
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      let nr = r + dr, nc = c + dc;
      if (wrap) { nr = (nr + ROWS) % ROWS; nc = (nc + COLS) % COLS; }
      else if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
      n += grid[idx(nr, nc)];
    }
  }
  return n;
}

function stepOnce() {
  let pop = 0;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const n = getNeighbors(r, c);
      const alive = grid[idx(r, c)];
      nextGrid[idx(r, c)] = alive ? (surviveSet.has(n) ? 1 : 0) : (birthSet.has(n) ? 1 : 0);
      pop += nextGrid[idx(r, c)];
    }
  }
  [grid, nextGrid] = [nextGrid, grid];
  gen++;
  popHistory.push(pop);
  if (popHistory.length > 200) popHistory.shift();
  document.getElementById('genCount').textContent = gen;
  document.getElementById('popCount').textContent = pop;
  render();
  drawSparkline();
}

function render() {
  ctx.fillStyle = '#030712';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#22c55e';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (grid[idx(r, c)]) ctx.fillRect(c*CELL+1, r*CELL+1, CELL-1, CELL-1);
    }
  }
  // Light grid lines
  ctx.strokeStyle = '#0f172a';
  ctx.lineWidth = 0.5;
  for (let c = 0; c <= COLS; c++) { ctx.beginPath(); ctx.moveTo(c*CELL, 0); ctx.lineTo(c*CELL, H); ctx.stroke(); }
  for (let r = 0; r <= ROWS; r++) { ctx.beginPath(); ctx.moveTo(0, r*CELL); ctx.lineTo(W, r*CELL); ctx.stroke(); }
}

function drawSparkline() {
  const sw = sparkCanvas.width, sh = sparkCanvas.height;
  sparkCtx.fillStyle = '#030712';
  sparkCtx.fillRect(0, 0, sw, sh);
  if (popHistory.length < 2) return;
  const maxPop = Math.max(...popHistory, 1);
  sparkCtx.beginPath();
  sparkCtx.strokeStyle = '#22c55e';
  sparkCtx.lineWidth = 1.5;
  popHistory.forEach((p, i) => {
    const x = (i / (popHistory.length - 1)) * sw;
    const y = sh - (p / maxPop) * sh * 0.9 - 2;
    i === 0 ? sparkCtx.moveTo(x, y) : sparkCtx.lineTo(x, y);
  });
  sparkCtx.stroke();
}

function toggleRun() {
  running = !running;
  document.getElementById('runBtn').textContent = running ? '⏸ Pause' : '▶ Run';
  if (running) loopRun();
}

let lastStep = 0;
function loopRun(ts = 0) {
  if (!running) return;
  const speed = parseInt(document.getElementById('speed').value);
  const interval = 1000 / speed;
  if (ts - lastStep >= interval) { stepOnce(); lastStep = ts; }
  rafId = requestAnimationFrame(loopRun);
}

function clearGrid() {
  grid.fill(0); gen = 0; popHistory = [];
  document.getElementById('genCount').textContent = 0;
  document.getElementById('popCount').textContent = 0;
  render(); drawSparkline();
}

function randomize() {
  for (let i = 0; i < COLS*ROWS; i++) grid[i] = Math.random() < 0.3 ? 1 : 0;
  gen = 0; popHistory = [];
  render();
}

const PATTERNS = {
  glider: [[0,1],[1,2],[2,0],[2,1],[2,2]],
  gun: [
    [5,1],[5,2],[6,1],[6,2],
    [5,11],[6,11],[7,11],[4,12],[8,12],[3,13],[9,13],[3,14],[9,14],
    [6,15],[4,16],[8,16],[5,17],[6,17],[7,17],[6,18],
    [3,21],[4,21],[5,21],[3,22],[4,22],[5,22],[2,23],[6,23],
    [1,25],[2,25],[6,25],[7,25],
    [3,35],[4,35],[3,36],[4,36]
  ],
  pulsar: [
    [2,4],[2,5],[2,6],[2,10],[2,11],[2,12],
    [4,2],[4,7],[4,9],[4,14],[5,2],[5,7],[5,9],[5,14],[6,2],[6,7],[6,9],[6,14],
    [7,4],[7,5],[7,6],[7,10],[7,11],[7,12],
    [9,4],[9,5],[9,6],[9,10],[9,11],[9,12],
    [10,2],[10,7],[10,9],[10,14],[11,2],[11,7],[11,9],[11,14],[12,2],[12,7],[12,9],[12,14],
    [14,4],[14,5],[14,6],[14,10],[14,11],[14,12]
  ].map(([r,c]) => [r+5, c+5]),
  rpentomino: [[0,1],[0,2],[1,0],[1,1],[2,1]],
  acorn: [[0,1],[1,3],[2,0],[2,1],[2,4],[2,5],[2,6]]
};

function loadPreset() {
  const name = document.getElementById('presetSelect').value;
  if (!name) return;
  clearGrid();
  const cells = PATTERNS[name];
  if (!cells) return;
  const minR = Math.min(...cells.map(([r])=>r));
  const minC = Math.min(...cells.map(([,c])=>c));
  const maxR = Math.max(...cells.map(([r])=>r));
  const maxC = Math.max(...cells.map(([,c])=>c));
  const offR = Math.floor((ROWS - (maxR-minR)) / 2) - minR;
  const offC = Math.floor((COLS - (maxC-minC)) / 2) - minC;
  cells.forEach(([r, c]) => {
    const nr = r + offR, nc = c + offC;
    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) grid[idx(nr, nc)] = 1;
  });
  document.getElementById('presetSelect').value = '';
  render();
}

// Mouse drawing
function canvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width, scaleY = H / rect.height;
  const cx = (e.clientX - rect.left) * scaleX;
  const cy = (e.clientY - rect.top) * scaleY;
  return [Math.floor(cy / CELL), Math.floor(cx / CELL)];
}
canvas.addEventListener('mousedown', e => {
  painting = true;
  const [r, c] = canvasPos(e);
  paintValue = grid[idx(r,c)] ? 0 : 1;
  if (r>=0&&r<ROWS&&c>=0&&c<COLS) { grid[idx(r,c)] = paintValue; render(); }
});
canvas.addEventListener('mousemove', e => {
  if (!painting) return;
  const [r, c] = canvasPos(e);
  if (r>=0&&r<ROWS&&c>=0&&c<COLS) { grid[idx(r,c)] = paintValue; render(); }
});
window.addEventListener('mouseup', () => { painting = false; });

applyRules();
render();
</script>
</body>
</html>
